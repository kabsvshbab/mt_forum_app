name: mt_forum
description: MT论坛 iOS26 液态玻璃风格客户端
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  flutter_riverpod: ^2.5.1
  dio: ^5.4.3
  dio_cookie_manager: ^3.1.1
  cookie_jar: ^4.0.8
  path_provider: ^2.1.3
  html: ^0.15.4
  cached_network_image: ^3.3.1
  hive_flutter: ^1.1.0
  shimmer: ^3.0.0
  shared_preferences: ^2.2.3
  url_launcher: ^6.2.5
  flutter_inappwebview: ^6.0.0
  intl: ^0.19.0
  flutter_spinkit: ^5.2.1
  flutter_html: ^3.0.0-beta.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.2

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/shaders/
